  by: claude-sonnet-5-5
  recordingSha256: ca110544976c65df7e6ff3824d2b413c5c9b0e7cfb92e105ead96b5f6572c9f4
  marks:
    - variant: "turns"
      maker: A
      run: 1
      shows: true
      note: "The check names the real clash: lectures fill Monday, Wednesday and Friday mornings. The plan uses early slots before lectures on those days. Some of its breaks depend on a gap between lectures that it assumed."
    - variant: "turns"
      maker: A
      run: 2
      shows: true
      note: "The check lists four items in a table. The fourth, not enough morning time, is a risk, not an overlap. The plan uses Tuesday and Thursday mornings and early slots, with two labelled breaks a day. It warns that Thursday is overloaded."
    - variant: "turns"
      maker: A
      run: 3
      shows: true
      note: "The check names the same clash and the plan uses Tuesday and Thursday mornings plus early slots. It assumes the job runs to 10 pm, where the other two runs assumed 9 pm. One item in its list, little slack on Thursday, is a risk, not an overlap."
    - variant: "turns"
      maker: B
      run: 1
      shows: false
      note: "The check names the lecture clash, but the plan starts the Wednesday and Friday lectures at 9:30. Its own assumption says 9:00. Two of the clashes it lists are not timetable clashes."
      falseText: "**9:30 AM–12:00 PM**: **Lecture**"
      reason: "The plan's assumption line says lectures run 9:00 AM to 12:00 PM, and the Monday line agrees. The Wednesday and Friday lines start them at 9:30."
    - variant: "turns"
      maker: B
      run: 2
      shows: false
      note: "The list of clashes says lectures clash with essay work in the afternoon, and that the evening job leaves no morning time. Both are wrong. The plan itself puts essay work before lectures."
