# R-4.8: eight copies of one 170-word paragraph (lesson 1.7, Training). Counting rule and the table of every mark: pack section 3.
R-4.8:
  summary: |
    We gave two tools one paragraph of 170 words from lesson 1.7, "Training". We asked each for four copies, once each, on 8 October 2026. That is eight copies. We wrote down a list of ten key points in the paragraph and compared each copy with it.

    Three copies kept all ten key points. These are Claude Sonnet 5.5's plain words, bullet points and outline. Five copies did not.

    Summary, Claude Sonnet 5.5: kept seven in full and one in part. It dropped two.

    Summary, Ministral 3 14B: kept three in full and three in part. It dropped four.

    Plain words, Claude: kept all ten. Plain words, Ministral: kept nine in full and one in part.

    Bullet points, Claude: kept all ten. Bullet points, Ministral: kept nine in full and changed one.

    Outline, Claude: kept all ten. Outline, Ministral: kept seven in full and one in part. It dropped two.

    All four of Ministral's copies lost something. Only Claude's summary lost something among Claude's four.

    A summary was asked to be two sentences, so it had little room. This is one paragraph, two tools and one run each, on one day. It shows what these eight copies kept. It does not show how any tool or any kind of copy behaves in general.

    We counted a point as kept when all of it was there, in any words. Extra true text that the paragraph does not say was not counted as a loss and was not called false.
  checked: 2026-10-09
  by: claude-sonnet-5-5
  recordingSha256: af1a6a7ae879ce4ace61f133850f31feb797f1db7476d831b0ff9f04c87a0e58
  marks:
    - {variant: summary, maker: A, run: 1, shows: true, note: "What was lost: how the steps get smaller as the slope flattens. Also that two claims are the textbook's. Both read as the summary's own. It said going downhill 'reliably' reaches the lowest loss, which the paragraph does not say."}
    - {variant: summary, maker: B, run: 1, shows: true, note: "What was lost: that people choose the learning rate, that the loss can bounce around or go up, and that the steps get smaller. Also that several settings can share the lowest level, that a perfect split means no lowest level, and that two claims are the textbook's. It says simple models 'reliably reach the global minimum', a term the paragraph does not use. The paragraph says this only for a yes-or-no model like the one in Training, and it names an exception.", falseText: "simple models like binary classifiers reliably reach the global minimum", reason: "The paragraph says this only for a yes-or-no model like the one in Training, and it adds that when a straight line splits the dots perfectly there is no lowest level. The textbook it draws on (Jurafsky and Martin, Speech and Language Processing, chapter 4) says the loss is convex for logistic regression, so there are no local minima. It says the loss for multi-layer neural networks is non-convex."}
    - {variant: plain words, maker: A, run: 1, shows: false, note: "Nothing was lost. It added the word 'error' beside 'loss' and called the steps 'small'. The paragraph does not say either."}
    - {variant: plain words, maker: B, run: 1, shows: true, note: "What was lost: that people choose the learning rate. It also opens with 'a way to find the best numbers for a model', where the paragraph says gradient descent finds each change."}
    - {variant: bullet points, maker: A, run: 1, shows: false, note: "Nothing was lost. It added a 'Special case' label."}
    - {variant: bullet points, maker: B, run: 1, shows: true, note: "What was changed: the paragraph says the loss keeps falling as the numbers grow. This copy says as the model scales, which the paragraph does not say. It also puts two ideas under 'the textbook states' that the paragraph does not credit to the textbook."}
    - {variant: outline, maker: A, run: 1, shows: false, note: "Nothing was lost. It added headings and a 'Special case' label."}
    - {variant: outline, maker: B, run: 1, shows: true, note: "What was lost: that people choose the learning rate, that several settings can share the lowest level, and that two claims are the textbook's. It added 'local minimum or saddle point' and 'high-dimensional spaces', which the paragraph never says."}
