R-4.1:
  summary: |
    We asked two models one question, five times each. It was about reading on paper and on a screen. It asked for four sources with links.
    We recorded the answers on 8 October 2026. We checked all forty sources on 9 October 2026.

    Claude Sonnet 5.5 named four sources in each of its five answers, twenty in all. All twenty were real and relevant. They were five papers, each named several times.

    Ministral 3 14B also named twenty. None was real and relevant. Twelve were real but unrelated: the link or the details led to a different work. Eight were not there: we could not find them.

    So across the forty: twenty were real and relevant, twelve real but unrelated and eight not there. Neither model had web search.

    This is two models, one question and one day. It does not show how often AI invents citations.

    How we counted: we opened each link as given. A DOI that opened a different work was real but unrelated. If a link failed, we searched the exact title. If we found nothing, it was not there.
  checked: 2026-10-09
  by: claude-sonnet-5-5
  recordingSha256: aec9ad3c2b007a8b348227e54727302e1faa7ff61931718e8b1d88e256141424
