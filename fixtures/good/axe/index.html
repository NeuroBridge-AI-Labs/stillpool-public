<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>axe good</title>
<style>
/* Settled colours pass in every theme; half-way through the 3 s switch to dark they do not. Like the site, the
   transition ends at once when the device asks for reduced motion. */
.panel { background: #fff; color: #111; transition: background-color 3s; }
[data-theme="dark"] .panel { background: #111; color: #eee; }
@media (prefers-reduced-motion: reduce) { .panel { transition-duration: 0.001ms; } }
</style>
</head>
<body>
<main>
<h1>Axe fixture</h1>
<p>Read more about how models work in <a href="/" style="text-decoration:underline;">this short lesson</a>.</p>
<button style="width:24px;height:24px;">Go</button>
<p class="panel">This panel changes colour with the theme.</p>
</main>
</body>
</html>
