    <script>
      // ponytail: setTimeout lets the content above paint first, so the busy loop lands as a long
      // task after first paint, inside Lighthouse's blocking-time window, not before it.
      setTimeout(function () {
        var stop = Date.now() + 1000;
        while (Date.now() < stop) {}
      }, 0);
